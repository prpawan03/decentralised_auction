# Pre-commit hooks for this repository.
#
# Install once:   pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# Run on demand:  pre-commit run --all-files
#
# This repository is Solidity and TypeScript. The Python formatters (black,
# ruff) are kept for any script that may be added later; they run only on
# *.py files and are no-ops today. The checks that matter for this code are
# the local hooks at the bottom: solhint, the web typecheck and the format
# check, which are the same commands CI runs.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

exclude: |
  (?x)^(
    package-lock\.json|
    web/src/abi/.*\.ts|
    contracts/src/vendor/.*|
    contracts/legacy/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
        # Compose files use the `!override` and `!reset` merge tags.
        args: [--unsafe]
      - id: check-json
        # These two are JSON-with-comments by their tools' own conventions.
        exclude: ^(\.devcontainer/devcontainer\.json|.*tsconfig.*\.json)$
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: debug-statements
      - id: check-ast
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        # Windows scripts are CRLF on purpose; see .gitattributes.
        exclude: \.(bat|cmd|ps1)$
      - id: detect-private-key
        # .env.example holds the universally known Hardhat test key on purpose.
        # It funds nothing and every Ethereum tool ships it. See SECURITY.md.
        exclude: ^(\.env\.example|SECURITY\.md|docs/.*\.md)$
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--config=pyproject.toml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --config=pyproject.toml]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(package-lock\.json|\.env\.example|contracts/src/vendor/.*)$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]

  - repo: local
    hooks:
      - id: prettier
        name: prettier --check
        entry: npx --no-install prettier --check
        language: system
        types_or: [javascript, ts, tsx, json, css, markdown, yaml]
        exclude: ^(web/src/abi/|web/src/deployments/|contracts/(artifacts|cache|coverage|legacy|deployments)/|contracts/src/vendor/|package-lock\.json)
      - id: solhint
        name: solhint (contracts)
        entry: npm run --silent lint --workspace contracts --
        language: system
        files: ^contracts/(src|test)/.*\.sol$
        pass_filenames: false
      - id: web-typecheck
        name: tsc --noEmit (web)
        entry: npm run --silent typecheck --workspace web --
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
      - id: action-pins
        name: GitHub Actions pinned to commit SHAs
        entry: node scripts/check-action-pins.mjs
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
