# ---------------------------------------------------------------------------
# Continuous integration.
#
# Jobs:
#   supply-chain  Every action is pinned to a commit SHA. See the policy below.
#   contracts  Lint, build, test, coverage floor, ABI freshness.
#   web        Lint, type check, unit test, build, bundle size ceiling.
#   slither    Static analysis of the Solidity code. The result goes to the
#              GitHub security tab as SARIF.
#   docker     Build every image with buildx, then scan them with Trivy.
#   smoke      Start the whole stack with Compose and check that it answers.
#
# A job MUST fail the pipeline when its gate fails. No gate uses
# `continue-on-error`, except the SARIF upload, which needs a permission that
# a fork does not have.
#
# ---------------------------------------------------------------------------
# ACTION PINNING POLICY
#
# Every third-party action is pinned to a full 40-character commit SHA, with
# the human-readable version in a trailing comment. A tag is a MOVING pointer:
# the tag owner can repoint it at any commit, and `uses: someone/action@v4`
# then silently runs new code inside a job that holds this repository's
# secrets.
#
# This is not hypothetical. Between 2026-03-19 and 2026-03-23 an attacker
# force-pushed malicious commits over 76 of the 77 version tags of
# `aquasecurity/trivy-action` -- the action this file uses below -- and over
# every tag of `aquasecurity/setup-trivy`. The payload harvested SSH keys,
# cloud credentials and Kubernetes secrets from the runner.
# See CVE-2026-33634 / GHSA-69fq-xp46-6x23.
#
# A commit SHA cannot be repointed, so a pinned workflow is unaffected by a
# tag force-push. Treat unpinning as a security regression, not a style
# change. `scripts/check-action-pins.mjs` enforces this, and the
# `supply-chain` job below runs it.
#
# HOW TO UPDATE A PIN
#   git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>^{}'
#   # Annotated tags need the ^{} dereference to reach the COMMIT. If that
#   # prints nothing the tag is lightweight, so drop the ^{}.
# Replace the SHA and the trailing version comment TOGETHER. A stale comment
# is worse than none.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push MUST cancel an older run on the same branch. This saves runner
# time and it reports the newest commit first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default token is read-only. A job that needs more asks for more.
permissions:
  contents: read

env:
  NODE_VERSION: "24"
  COVERAGE_MIN: "80"
  FORCE_COLOR: "1"

jobs:
  # -------------------------------------------------------------------------
  # supply-chain: the pinning policy above, enforced.
  #
  # This job holds no secrets and installs nothing, so it is the cheapest gate
  # in the file. An unpinned action is a finding about THIS pipeline, and it
  # stays visible even when a build job fails for an unrelated reason.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The script uses only Node built-ins, so there is deliberately no
      # `npm ci` here. A supply-chain gate that first installs the dependency
      # tree it exists to protect would defeat its own purpose.
      - name: Check that every action is pinned to a commit SHA
        run: node scripts/check-action-pins.mjs

  # -------------------------------------------------------------------------
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the workspace packages
        run: npm ci

      # The contracts workspace owns the glob. Its `lint` script covers
      # src/**/*.sol and test/**/*.sol.
      - name: Lint the Solidity code
        run: npm run lint --workspace contracts

      - name: Build the contracts
        run: npm run build --workspace contracts

      - name: Run the tests
        run: npm run test --workspace contracts

      # `--coverage` is a GLOBAL Hardhat 3 option and not a task. It writes
      # contracts/coverage/lcov.info. This was checked against hardhat 3.14.
      - name: Measure the coverage
        working-directory: contracts
        run: npx hardhat test --coverage

      - name: Check the coverage floor
        run: node scripts/check-coverage.mjs contracts/coverage/lcov.info --min "${COVERAGE_MIN}"

      # The web workspace imports a generated ABI. A stale ABI compiles and it
      # then fails at run time, so the check regenerates the file and it
      # compares the result with the committed file.
      - name: Check that the ABI is fresh
        run: |
          set -euo pipefail
          if ! npm run --workspace contracts --if-present export-abi; then
            echo "::warning::The contracts workspace has no 'export-abi' script. Skipping the check."
            exit 0
          fi
          if ! git diff --exit-code --stat; then
            echo "::error::The committed ABI does not match the compiled contracts."
            echo "Run 'npm run export-abi --workspace contracts' and commit the result."
            git diff
            exit 1
          fi
          echo "The ABI is fresh."

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-coverage
          path: contracts/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the workspace packages
        run: npm ci

      # The web build imports the contract ABI, so the contracts MUST compile
      # first.
      - name: Build the contracts
        run: npm run build --workspace contracts

      # The web workspace has no `lint` script. It has `typecheck`,
      # `check:contrast` and `test`. Run each one as its own step, so a
      # failure names the gate that failed.
      - name: Check the types
        run: npm run typecheck --workspace web

      - name: Check the colour contrast
        run: npm run check:contrast --workspace web

      - name: Run the unit tests
        run: npm run test --workspace web

      - name: Build the bundle
        run: npm run build --workspace web

      - name: Check the bundle size ceiling
        run: node scripts/check-bundle-size.mjs web/dist

      - name: Upload the bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  slither:
    name: Slither
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the workspace packages
        run: npm ci

      - name: Run Slither
        id: slither
        uses: crytic/slither-action@4fd765aeef19915d04ddf0be90c2930036a774d8 # v0.4.1
        continue-on-error: true
        with:
          target: contracts/
          slither-args: --exclude-dependencies
          sarif: results.sarif
          fail-on: none

      - name: Send the result to the security tab
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        # A pull request from a fork has no write access to the security tab.
        # The analysis still ran, so a missing upload MUST NOT fail the build.
        continue-on-error: true
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
          category: slither

  # -------------------------------------------------------------------------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chain
            dockerfile: docker/chain.Dockerfile
            target: runtime
          - name: deployer
            dockerfile: docker/deployer.Dockerfile
            target: runtime
          - name: web
            dockerfile: docker/web.Dockerfile
            target: prod
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the ${{ matrix.name }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: auction/${{ matrix.name }}:ci
          # The GitHub Actions cache keeps a layer between runs.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

      # SECURITY: this action MUST stay at v0.35.0 or later. The previous pin
      # here was `@0.28.0`, a tag inside the range rewritten by the 2026-03
      # supply-chain attack (CVE-2026-33634). check-action-pins.mjs enforces
      # the floor so it cannot silently regress.
      - name: Scan the ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy pulls its database from GHCR, which rate-limits anonymous
          # pulls. GITHUB_TOKEN does NOT lift that limit, because the database
          # lives outside this repository's namespace. A mirror keeps a red
          # build from meaning nothing about this code.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        with:
          image-ref: auction/${{ matrix.name }}:ci
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Send the scan to the security tab
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      # A CRITICAL problem with a known fix MUST fail the build. The scan
      # above only reports; this step decides.
      - name: Fail on a fixable CRITICAL problem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
          # The scan above already put the database in the runner cache. Skip
          # the second download so one flaky registry call cannot fail the gate.
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          image-ref: auction/${{ matrix.name }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # -------------------------------------------------------------------------
  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [contracts, web]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create the environment file
        run: cp .env.example .env

      - name: Check that both Compose file sets parse
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          echo "Both Compose file sets parse."

      # The production shape is the one that a smoke test can check without a
      # browser, because nginx serves a finished bundle.
      - name: Start the stack
        run: docker compose -f compose.yaml -f compose.prod.yaml up -d --build --wait --wait-timeout 600

      - name: Show the deployer log
        run: docker compose -f compose.yaml -f compose.prod.yaml logs deployer

      # The gate: the chain answers, bytecode exists at the deployed address,
      # and the frontend serves the shell.
      - name: Run the smoke test
        run: node scripts/smoke.mjs
        env:
          WAIT_SECONDS: "120"

      - name: Show every log when the smoke test failed
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml logs --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.prod.yaml down --volumes --remove-orphans

  # -------------------------------------------------------------------------
  # One required check for the branch protection rule. A protected branch then
  # needs a single entry instead of one entry for every job above.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [supply-chain, contracts, web, slither, docker, smoke]
    steps:
      - name: Check that every job succeeded
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, " ") }}'
          echo "Job results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::At least one job did not succeed."
              exit 1
            fi
          done
          echo "Every job succeeded."
